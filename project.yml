name: MaillageThread
options:
  bundleIdPrefix: fr.djoko.maillage
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Signature.xcconfig
  Release: Signature.xcconfig
# Sparkle 2 : les mises a jour de l'app, a une version figee (gestionnaire de paquets Swift).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Textes : catalogues .xcstrings (francais, langue de developpement, et
    # anglais), cles extraites par le compilateur.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  MaillageCoeur:
    type: framework
    platform: macOS
    sources:
      - path: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.coeur
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
      configs:
        # Le coeur est optimise aussi en Debug : non optimisee, la disposition des pieces prend
        # quelques secondes (80 a 100 fois plus). Il n'a ni assert ni code propre au Debug.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  MaillageThread:
    type: application
    platform: macOS
    sources:
      - path: MaillageThread
    dependencies:
      - target: MaillageCoeur
      - package: Sparkle
    info:
      path: MaillageThread/Info.plist
      properties:
        CFBundleDisplayName: Maillage Thread
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Mises a jour (Sparkle 2) : le flux des versions publiees et la cle publique Ed25519 (reglages ci-dessous) ;
        # recherche au demarrage puis toutes les 24 h, telechargement et installation automatiques ; installation
        # par le service de Sparkle, l'app restant dans le bac a sable.
        SUFeedURL: $(FLUX_MISES_A_JOUR)
        SUPublicEDKey: $(CLE_MISES_A_JOUR)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableInstallerLauncherService: true
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: "Maillage Thread écoute les annonces du réseau local (routeurs de bordure Thread, appareils Matter et HomeKit) pour dessiner le réseau Thread, et se connecte à sa sonde par le réseau Thread si vous le choisissez."
        NSBonjourServices:
          - _meshcop._udp
          - _matter._tcp
          - _hap._udp
    settings:
      base:
        PRODUCT_NAME: Maillage Thread
        PRODUCT_MODULE_NAME: MaillageThread
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # La version publiee (outils/publier.sh) ; le numero de compilation, que compare Sparkle, est donne a la
        # publication : le nombre de commits de main.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Le flux des mises a jour (appcast.xml du depot, que publier.sh tient a jour, a son adresse brute) et la cle
        # publique ; la repetition les remplace en ligne de commande.
        FLUX_MISES_A_JOUR: https://raw.githubusercontent.com/Djoko-cli/maillage-thread/main/appcast.xml
        CLE_MISES_A_JOUR: lkPxEHj5erw+omLlr1AVsIoyhfz4YnoLa/N9147SNgc=
        CODE_SIGN_ENTITLEMENTS: MaillageThread/Droits.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  Passeur:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Passeur
      - path: MaillageCoeur/Noms/NomsMaison.swift
      - path: MaillageCoeur/Noms/EnvoiPasseur.swift
      - path: MaillageCoeur/Annonces/CodageJSON.swift
    info:
      path: Passeur/Info.plist
      properties:
        CFBundleDisplayName: Passeur Noms
        # Schema d'URL par lequel Maillage Thread lui donne le port et le jeton (EnvoiPasseur.schema).
        CFBundleURLTypes:
          - CFBundleURLName: fr.djoko.maillage.passeur
            CFBundleURLSchemes:
              - maillage-passeur
        NSHomeKitUsageDescription: "Passeur Noms lit les noms, pièces, zones, fabricants et batteries de vos accessoires Maison pour Maillage Thread. Rien ne sort de ce Mac."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_NAME: Passeur Noms
        PRODUCT_MODULE_NAME: Passeur
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.passeur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Passeur/Passeur.entitlements
        # HomeKit exige un profil : signature automatique ; l'equipe est donnee
        # par outils/passeur.sh (DEVELOPMENT_TEAM en ligne de commande) ; ne pas
        # creer Local.xcconfig : il signerait aussi l'app.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  MaillageCoeurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaillageCoeurTests
    dependencies:
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.coeur.tests
        GENERATE_INFOPLIST_FILE: YES
  MaillageThreadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaillageThreadTests
    dependencies:
      - target: MaillageThread
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.tests
        GENERATE_INFOPLIST_FILE: YES
        # Le produit s'appelle "Maillage Thread" (avec une espace), pas comme la cible.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maillage Thread.app/Contents/MacOS/Maillage Thread"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MaillageThread:
    build:
      targets:
        MaillageThread: all
        MaillageCoeur: all
        MaillageCoeurTests: [test]
        MaillageThreadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaillageCoeurTests
        - MaillageThreadTests
    archive:
      config: Release
  Passeur:
    build:
      targets:
        Passeur: all
    run:
      config: Debug
  # Le coeur seul : les temps de calcul de la vue par pieces, en Release (outils/mesurer.sh).
  MaillageCoeur:
    build:
      targets:
        MaillageCoeur: all
        MaillageCoeurTests: [test]
    test:
      config: Release
      targets:
        - MaillageCoeurTests
