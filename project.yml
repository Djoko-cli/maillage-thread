name: MaillageThread
options:
  bundleIdPrefix: fr.djoko.maillage
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Signature.xcconfig
  Release: Signature.xcconfig
# Sparkle 2 : les mises a jour de l'app, a une version figee (gestionnaire de paquets Swift).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Textes : catalogues .xcstrings (francais, langue de developpement, et
    # anglais), cles extraites par le compilateur.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  MaillageCoeur:
    type: framework
    platform: macOS
    sources:
      - path: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.coeur
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
      configs:
        # Le coeur est optimise aussi en Debug : non optimisee, la disposition des pieces prend
        # quelques secondes (80 a 100 fois plus). Il n'a ni assert ni code propre au Debug.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  MaillageThread:
    type: application
    platform: macOS
    sources:
      - path: MaillageThread
    dependencies:
      - target: MaillageCoeur
      - package: Sparkle
    info:
      path: MaillageThread/Info.plist
      properties:
        CFBundleDisplayName: Maillage Thread
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Mises a jour (Sparkle 2) : le flux des versions publiees et la cle publique Ed25519 (reglages ci-dessous) ;
        # recherche au demarrage puis toutes les 24 h, telechargement et installation automatiques ; installation
        # par le service de Sparkle, l'app restant dans le bac a sable.
        SUFeedURL: $(FLUX_MISES_A_JOUR)
        SUPublicEDKey: $(CLE_MISES_A_JOUR)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableInstallerLauncherService: true
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: "Maillage Thread écoute les annonces du réseau local (routeurs de bordure Thread, appareils Matter et HomeKit) pour dessiner le réseau Thread, et se connecte à sa sonde par le réseau Thread si vous le choisissez."
        NSBonjourServices:
          - _meshcop._udp
          - _matter._tcp
          - _hap._udp
          - _trel._udp
    settings:
      base:
        PRODUCT_NAME: Maillage Thread
        PRODUCT_MODULE_NAME: MaillageThread
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # La version publiee (outils/publier.sh) ; le numero de compilation, que compare Sparkle, est donne a la
        # publication : le nombre de commits de main.
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        # Le flux des mises a jour (appcast.xml du depot, que publier.sh tient a jour, a son adresse brute) et la cle
        # publique ; la repetition les remplace en ligne de commande.
        FLUX_MISES_A_JOUR: https://raw.githubusercontent.com/Djoko-cli/maillage-thread/main/appcast.xml
        CLE_MISES_A_JOUR: nRIVHOXbEktqGduJ4ukxhjZzlUaiE/yqR3sgbW9Ie6E=
        CODE_SIGN_ENTITLEMENTS: MaillageThread/Droits.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # Passeur Noms, demon de Maison (spec 2026-10-12-demon-passeur-design.md) : app Mac Catalyst sans fenetre ni Dock
  # (LSUIElement), signee en developpement par outils/passeur.sh de maillage-iot (HomeKit est refuse au Developer ID). Masqueur.bundle
  # rend invisible, des sa creation, la fenetre de la scene que macOS impose.
  Masqueur:
    type: bundle
    platform: macOS
    sources:
      - path: Masqueur
    info:
      path: Masqueur/Info.plist
      properties:
        NSPrincipalClass: Masqueur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.passeur.masqueur
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
  Passeur:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Passeur
      - path: MaillageCoeur/Noms/NomsMaison.swift
      - path: MaillageCoeur/Noms/ProtocolePasseur.swift
      - path: MaillageCoeur/Annonces/CodageJSON.swift
    dependencies:
      - target: Masqueur
        embed: true
        platformFilter: macOS
        copy:
          destination: plugins
    info:
      path: Passeur/Info.plist
      properties:
        CFBundleDisplayName: Passeur Noms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Schema d'URL par lequel les apps lui donnent le port et le jeton (EnvoiPasseur.schema).
        CFBundleURLTypes:
          - CFBundleURLName: fr.djoko.maillage.passeur
            CFBundleURLSchemes:
              - maillage-passeur
              # Second schema : seul le nouveau demon le declare, les apps le trouvent par lui (EnvoiPasseur.schemaProtocole).
              - maillage-passeur-1
        # Ni Dock ni menu : un demon.
        LSUIElement: true
        # Version du protocole parle (abonnement) : outils/passeur.sh de maillage-iot reconnait ainsi le demon (les apps, par le schema).
        MaillagePasseurProtocole: 1
        NSHomeKitUsageDescription: "Passeur Noms lit les noms, pièces, zones, fabricants et batteries de vos accessoires Maison pour Maillage Thread et Maillage Zigbee, et fait clignoter un accessoire quand vous le demandez (Identifier). Rien ne sort de ce Mac."
        UILaunchScreen: {}
        # macOS 27 impose une scene : declaree sans contenu, gardee connectee et invisible (SceneDelegate).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Defaut
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        PRODUCT_NAME: Passeur Noms
        PRODUCT_MODULE_NAME: Passeur
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.passeur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Passeur/Passeur.entitlements
        # HomeKit exige un profil : signature automatique ; l'equipe est donnee par outils/passeur.sh de maillage-iot
        # (DEVELOPMENT_TEAM en ligne de commande).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  MaillageCoeurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaillageCoeurTests
    dependencies:
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.coeur.tests
        GENERATE_INFOPLIST_FILE: YES
  MaillageThreadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaillageThreadTests
    dependencies:
      - target: MaillageThread
      - target: MaillageCoeur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.tests
        GENERATE_INFOPLIST_FILE: YES
        # Le produit s'appelle "Maillage Thread" (avec une espace), pas comme la cible.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maillage Thread.app/Contents/MacOS/Maillage Thread"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Le coeur du demon Passeur Noms (Passeur/Logique), sans HomeKit ni UIKit, teste sur macOS. Il compile les fichiers
  # communs lui-meme, comme la cible Passeur : pas de dependance a MaillageCoeur (les types seraient en double).
  PasseurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PasseurTests
      - path: Passeur/Logique
      - path: MaillageCoeur/Noms/NomsMaison.swift
      - path: MaillageCoeur/Noms/ProtocolePasseur.swift
      - path: MaillageCoeur/Annonces/CodageJSON.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.maillage.passeur.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MaillageThread:
    build:
      targets:
        MaillageThread: all
        MaillageCoeur: all
        MaillageCoeurTests: [test]
        MaillageThreadTests: [test]
        PasseurTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaillageCoeurTests
        - MaillageThreadTests
        - PasseurTests
    archive:
      config: Release
  Passeur:
    build:
      targets:
        Passeur: all
    run:
      config: Debug
  # Le coeur seul : les temps de calcul de la vue par pieces, en Release (outils/mesurer.sh).
  MaillageCoeur:
    build:
      targets:
        MaillageCoeur: all
        MaillageCoeurTests: [test]
    test:
      config: Release
      targets:
        - MaillageCoeurTests
